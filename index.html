<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MEmori - Tu aliado en cada dosis.">
  <title>MEmori | Tu aliado en cada dosis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#3f45df;
      --blue-dark:#20247f;
      --blue-soft:#eef0ff;
      --green:#20b99b;
      --pink:#d946c8;
      --ink:#182052;
      --muted:#66708f;
      --bg:#f7f9ff;
      --white:#fff;
      --line:#e5e9f7;
      --shadow:0 18px 50px rgba(42,53,150,.13);
      --radius:26px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:Inter,Arial,sans-serif;color:var(--ink);
      background:linear-gradient(180deg,#f8faff 0%,#fff 48%,#f5f7ff 100%);
      line-height:1.6;overflow-x:hidden
    }
    a{text-decoration:none;color:inherit}
    .container{width:min(1160px,92%);margin:auto}
    .nav{
      position:sticky;top:0;z-index:50;
      backdrop-filter:blur(18px);
      background:rgba(248,250,255,.86);
      border-bottom:1px solid rgba(229,233,247,.8)
    }
    .nav-inner{height:76px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;font-family:Poppins;font-weight:800;font-size:25px}
    .brand-mark{
      width:46px;height:46px;border-radius:14px;
      background:linear-gradient(135deg,#5844e8,#3f45df);
      display:grid;place-items:center;color:white;font-size:23px;
      box-shadow:0 9px 24px rgba(63,69,223,.25)
    }
    .links{display:flex;gap:28px;font-size:14px;font-weight:600;color:#465078}
    .links a:hover{color:var(--blue)}
    .nav-cta,.btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:12px 19px;border-radius:999px;font-weight:700;border:1px solid transparent;
      transition:.2s ease;cursor:pointer
    }
    .nav-cta,.btn-primary{background:var(--blue);color:white;box-shadow:0 10px 24px rgba(63,69,223,.23)}
    .nav-cta:hover,.btn-primary:hover{transform:translateY(-2px);background:#3338c8}
    .btn-secondary{background:white;border-color:var(--line);color:var(--blue)}
    .hero{padding:76px 0 56px;position:relative}
    .hero:before,.hero:after{
      content:"";position:absolute;border-radius:50%;filter:blur(3px);z-index:-1
    }
    .hero:before{width:300px;height:300px;background:#dfe5ff;left:-150px;top:80px}
    .hero:after{width:260px;height:260px;background:#d8fff5;right:-120px;top:40px}
    .hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:55px;align-items:center}
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;background:#eceeff;color:var(--blue);
      padding:8px 13px;border-radius:999px;font-size:13px;font-weight:800;margin-bottom:18px
    }
    h1{font-family:Poppins;font-size:clamp(42px,6vw,72px);line-height:1.04;letter-spacing:-2.6px;margin-bottom:20px}
    .gradient{background:linear-gradient(90deg,var(--blue-dark),#5844e8,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero p{font-size:18px;color:var(--muted);max-width:600px;margin-bottom:28px}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    .hero-note{margin-top:18px;font-size:13px;color:#7b84a2}
    .hero-image{
      border-radius:32px;box-shadow:var(--shadow);width:100%;display:block;
      border:7px solid white
    }
    section{padding:90px 0}
    .section-head{text-align:center;max-width:720px;margin:0 auto 44px}
    .section-head .tag{color:var(--blue);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1.4px}
    h2{font-family:Poppins;font-size:clamp(30px,4vw,46px);line-height:1.1;margin:8px 0 14px}
    .section-head p{color:var(--muted);font-size:16px}
    .features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{
      background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:var(--radius);
      padding:27px;box-shadow:0 10px 30px rgba(43,55,150,.06);transition:.2s
    }
    .card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
    .icon{
      width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:25px;
      margin-bottom:18px
    }
    .i-blue{background:#e8eaff}.i-green{background:#ddfbf4}.i-pink{background:#fde5fa}
    .i-purple{background:#eee6ff}.i-cyan{background:#e3f5ff}.i-yellow{background:#fff4d9}
    .card h3{font-family:Poppins;font-size:20px;margin-bottom:7px}
    .card p{color:var(--muted);font-size:14px}
    .showcase{background:linear-gradient(135deg,#f0f2ff,#edfffa);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .showcase-img{width:100%;border-radius:28px;display:block;box-shadow:var(--shadow);border:7px solid white}
    .assistant{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
    .assistant-copy p{color:var(--muted);margin:14px 0 22px}
    .check{display:flex;gap:11px;margin:13px 0;font-weight:600}
    .check span{width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:#dcfaf3;color:#0c9e83;display:grid;place-items:center;font-size:14px}
    .chat{
      background:#fff;border:1px solid var(--line);border-radius:30px;padding:22px;
      box-shadow:var(--shadow)
    }
    .chat-top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
    .bot{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#5444e8,#20b99b);display:grid;place-items:center;color:white}
    .bubble{padding:13px 15px;border-radius:18px;margin:10px 0;max-width:88%;font-size:14px}
    .user-b{margin-left:auto;background:#eceeff;color:#3137bd;border-bottom-right-radius:5px}
    .bot-b{background:#f2f5fb;border-bottom-left-radius:5px}
    .lang{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:25px}
    .lang-card{padding:20px;border:1px solid var(--line);border-radius:22px;background:#fff}
    .lang-card strong{font-size:18px}.lang-card p{font-size:13px;color:var(--muted);margin-top:5px}
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .step{position:relative;padding:24px;background:#fff;border:1px solid var(--line);border-radius:22px}
    .num{font-family:Poppins;color:var(--blue);font-size:31px;font-weight:800}
    .step h3{font-size:17px;margin:5px 0}.step p{font-size:13px;color:var(--muted)}
    .project{background:linear-gradient(135deg,#222781,#5047e8);color:white}
    .project-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:45px;align-items:center}
    .project h2{font-size:40px}.project p{color:#e5e8ff;max-width:700px}
    .project-box{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:27px;border-radius:26px;backdrop-filter:blur(8px)}
    .project-box div{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:14px}
    .project-box div:last-child{border:0}
    footer{padding:35px 0;background:#171a58;color:#dce0ff}
    .footer-inner{display:flex;justify-content:space-between;gap:20px;align-items:center}
    .footer-brand{font-family:Poppins;font-weight:800;font-size:21px}
    .small{font-size:12px;color:#aeb5dd}
    .feature-card{cursor:pointer;overflow:hidden;outline:none;position:relative}
    .feature-card:focus-visible{box-shadow:0 0 0 3px rgba(63,69,223,.22),var(--shadow)}
    .feature-main{position:relative}
    .feature-card .more{display:inline-flex;margin-top:16px;padding:7px 11px;border-radius:999px;background:#f0f2ff;color:var(--blue);font-size:12px;font-weight:800}
    .feature-detail{max-height:0;opacity:0;overflow:hidden;transition:max-height .32s ease,opacity .25s ease,margin-top .25s ease,padding-top .25s ease;border-top:1px solid transparent}
    .feature-detail p{color:var(--muted);font-size:13px;margin-top:6px}
    .feature-card.open{box-shadow:var(--shadow)}
    .feature-card.open .feature-detail{max-height:260px;opacity:1;margin-top:18px;padding-top:17px;border-top-color:var(--line)}
    .feature-card.open .more{background:var(--blue);color:white}
    @media(max-width:900px){
      .links{display:none}.hero-grid,.assistant,.project-grid{grid-template-columns:1fr}.hero{padding-top:45px}
      .features{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}
      .assistant{gap:30px}.project-grid{gap:25px}
    }
    @media(max-width:600px){
      section{padding:65px 0}.features,.steps,.lang{grid-template-columns:1fr}
      .hero h1{letter-spacing:-1.5px}.hero p{font-size:16px}.nav-cta{padding:10px 14px;font-size:13px}
      .hero-image,.showcase-img{border-width:4px;border-radius:22px}.card{padding:22px}
      .footer-inner{flex-direction:column;text-align:center}
    }
  </style>
</head>
<body>
  <!-- === TODO TU HTML ORIGINAL AQUÍ (desde <nav> hasta el footer) === -->
  <!-- Pega aquí todo lo que ya tenías en tu index.html original -->

  <!-- === BURBUJA FINAL (con icono, sonido y todo pro) === -->
  <div id="appBubble" 
       class="fixed bottom-6 right-6 z-50 flex flex-col items-center cursor-pointer group transition-all duration-300">
    <div class="w-20 h-20 bg-white rounded-full shadow-2xl flex items-center justify-center 
                transition-all duration-300 group-hover:scale-110 group-hover:shadow-2xl group-hover:shadow-blue-400 ring-4 ring-blue-500 ring-offset-4">
      <img src="image.png" 
           alt="MEmori" 
           class="w-16 h-16 rounded-full object-cover transition-all duration-300">
    </div>
    <div class="text-center text-xs mt-1 text-gray-600 font-medium tracking-wide">
      ¡Abrir App!
    </div>
  </div>

  <script>
    // === TU SCRIPT ORIGINAL (manténlo igual) ===
    document.querySelectorAll(".feature-card").forEach(card => {
      const toggle = () => { 
        const open = card.classList.toggle("open"); 
        card.setAttribute("aria-expanded", open ? "true" : "false"); 
      };
      card.addEventListener("click", toggle);
      card.addEventListener("keydown", e => { 
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } 
      });
    });
    document.getElementById("year").textContent = new Date().getFullYear();

    // === BURBUJA CON TODO LO QUE PEDISTE ===
    const bubble = document.getElementById("appBubble");

    // Sonido al hacer clic
    function playSound() {
      const sound = new Audio("https://assets.mixkit.co/sfx/preview/274/274.wav"); // sonido de botón (puedes cambiarlo)
      sound.volume = 0.3;
      sound.play().catch(() => {}); // silencioso si falla
    }

    bubble.addEventListener("click", () => {
      playSound();
      // Abrir tu app web
      window.location.href = "https://stuwar110.github.io/MEmori/";
    });

    // Animación extra en hover
    bubble.addEventListener("mouseenter", () => {
      bubble.style.transform = "scale(1.08)";
    });
    bubble.addEventListener("mouseleave", () => {
      bubble.style.transform = "scale(1)";
    });
  </script>
</body>
</html>
